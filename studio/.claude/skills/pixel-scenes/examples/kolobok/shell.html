<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0a1c">
<title>Kolobok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --page-bg: #0f0a1c;
  --ui-ink: #fff4dc;
  --ui-dim: #efc3a4;
  --ui-mint: #bff0cf;
  --ui-solid: #0f0a1c;
  --ui-edge: #8f425e;
  --u: 3.6px;
  --font: 'Pixelify Sans', 'VT323', 'Courier New', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #0b0716; }
}
:root[data-theme="dark"] { --page-bg: #0b0716; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  height: 100%;
  background: var(--page-bg);
  color: var(--ui-ink);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font);
}
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stage {
  position: relative; overflow: hidden; width: 216px; height: 384px;
  font-size: calc(var(--u) * 4.4); line-height: 1.35; color: var(--ui-ink);
  touch-action: none; cursor: crosshair;
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
.shade { text-shadow: 0 0 calc(var(--u) * 1.4) var(--ui-solid), 0 calc(var(--u) * 0.35) 0 var(--ui-solid); }

#hud {
  position: absolute; z-index: 5; top: calc(var(--u) * 3); left: calc(var(--u) * 4); right: calc(var(--u) * 4);
  display: flex; justify-content: space-between; align-items: center;
  font-size: calc(var(--u) * 3.3); pointer-events: none;
}
#count { opacity: 0.9; }
#mute {
  pointer-events: auto; font: inherit; color: var(--ui-ink); background: transparent; cursor: pointer;
  border: calc(var(--u) * 0.45) solid var(--ui-edge); padding: calc(var(--u) * 0.6) calc(var(--u) * 1.8);
  opacity: 0.85;
}
#mute:focus-visible, #again:focus-visible { outline: calc(var(--u) * 0.6) solid var(--ui-mint); outline-offset: calc(var(--u) * 0.5); }

#caption {
  position: absolute; z-index: 5; top: 12%; left: 8%; right: 8%; text-align: center;
  font-size: calc(var(--u) * 4); color: var(--ui-ink);
  opacity: 0; transition: opacity 0.9s ease; pointer-events: none;
}
#caption.on { opacity: 1; }
#caption.song { color: var(--ui-dim); letter-spacing: 0.03em; }
#caption.stone { color: var(--ui-mint); font-weight: 600; font-size: calc(var(--u) * 5.2); letter-spacing: 0.16em; }
#caption.stone.on { animation: grind 0.12s steps(2, jump-none) 10; }
#caption.pebble { color: var(--ui-mint); font-size: calc(var(--u) * 3.5); letter-spacing: 0.06em; }
#prompt {
  position: absolute; z-index: 5; left: 6%; right: 6%; bottom: 5%; text-align: center;
  font-size: calc(var(--u) * 3.8); color: var(--ui-ink);
  opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
}
#prompt.on { opacity: 0.95; animation: breathe 2.4s ease-in-out infinite; }

#title {
  position: absolute; z-index: 7; inset: 0; display: flex; flex-direction: column; align-items: center;
  text-align: center; opacity: 0; transition: opacity 1.1s ease; pointer-events: none;
}
#title.on { opacity: 1; }
#title h1 {
  margin: 19% 0 0; font-size: calc(var(--u) * 14); font-weight: 600; line-height: 1; letter-spacing: 0.02em;
  color: var(--ui-ink);
}
#title .sub { margin: calc(var(--u) * 2.6) 0 0; font-size: calc(var(--u) * 4.2); color: var(--ui-dim); }
#title .begin { position: absolute; bottom: 17%; left: 0; right: 0; margin: 0; font-size: calc(var(--u) * 4.6); animation: breathe 2.6s ease-in-out infinite; }
#title .how { position: absolute; bottom: 10.5%; left: 10%; right: 10%; margin: 0; font-size: calc(var(--u) * 3.3); color: var(--ui-dim); }
#title .found { position: absolute; bottom: 5.5%; left: 0; right: 0; margin: 0; font-size: calc(var(--u) * 3.1); color: var(--ui-mint); }

#fade { position: absolute; z-index: 8; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 0.6s ease; }

#ending {
  position: absolute; z-index: 9; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 0 11%;
  background: linear-gradient(to bottom, transparent 8%, rgba(15, 10, 28, 0.72) 32%, rgba(15, 10, 28, 0.72) 68%, transparent 92%);
  opacity: 0; transition: opacity 1.6s ease; pointer-events: none;
}
#ending.on { opacity: 1; pointer-events: auto; }
#ending h2 { margin: 0; font-size: calc(var(--u) * 10); font-weight: 600; line-height: 1.05; color: #fff; }
#endText { margin: calc(var(--u) * 4) 0 0; color: #f6ecdf; max-width: 30em; }
#endFound { margin: calc(var(--u) * 4) 0 0; font-size: calc(var(--u) * 3.2); color: var(--ui-mint); }
#again {
  margin-top: calc(var(--u) * 5); font: inherit; color: #fff; background: transparent; cursor: pointer;
  border: calc(var(--u) * 0.6) solid #fff; padding: calc(var(--u) * 1.8) calc(var(--u) * 5);
}
#again:hover { background: #fff; color: var(--ui-solid); }

@keyframes breathe { 50% { opacity: 0.45; } }
@keyframes grind { 50% { transform: translate(0.06em, 0.03em); } }
@media (prefers-reduced-motion: reduce) {
  #prompt.on, #title .begin, #caption.stone.on { animation: none; }
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage" aria-label="Kolobok: a giant invisible loaf rolls through the wheat. Tap to sling flour at it.">
    <canvas id="c" width="216" height="384"></canvas>
    <div id="hud"><span id="count" class="shade" aria-live="polite"></span><button id="mute" type="button" aria-pressed="false">Sound on</button></div>
    <div id="caption" class="shade" aria-live="polite"></div>
    <div id="prompt" class="shade"></div>
    <div id="title" class="shade">
      <h1>Kolobok</h1>
      <p class="sub">A tale from the Verdant Reach</p>
      <p class="begin">Tap to begin</p>
      <p class="how">Tap to sling flour. Tap the stone to listen.</p>
      <p class="found" id="found"></p>
    </div>
    <div id="fade"></div>
    <div id="ending" aria-live="polite">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <p id="endFound"></p>
      <button id="again" type="button">Sling again</button>
    </div>
  </div>
</div>
<script>
/*__GAME__*/
</script>
</body>
</html>
