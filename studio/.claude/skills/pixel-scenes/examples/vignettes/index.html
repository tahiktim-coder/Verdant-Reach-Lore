<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Reach vignettes: old rules vs upgraded</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --page-bg: #05060d; --ink: #f2ecd9; --dim: #b8c0c8; --warm: #f0a53a; --u: 3.6px; --font: 'Pixelify Sans', 'VT323', 'Courier New', ui-monospace, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #04050a; } }
:root[data-theme="dark"] { --page-bg: #04050a; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body { height: 100%; background: var(--page-bg); color: var(--ink); overflow: hidden; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stage { position: relative; overflow: hidden; width: 216px; height: 384px; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
.shade { text-shadow: 0 0 calc(var(--u) * 1.4) #04050a, 0 calc(var(--u) * 0.35) 0 #04050a; }
#bar { position: absolute; z-index: 5; top: calc(var(--u) * 3); left: calc(var(--u) * 3); right: calc(var(--u) * 3); display: flex; align-items: center; gap: calc(var(--u) * 2); }
#name { flex: 1; margin: 0; text-align: center; font-size: calc(var(--u) * 4); line-height: 1.2; }
button { font: inherit; color: var(--ink); background: rgba(5, 6, 13, 0.55); border: calc(var(--u) * 0.45) solid #415c76; padding: calc(var(--u) * 0.8) calc(var(--u) * 2); font-size: calc(var(--u) * 3.6); cursor: pointer; }
#mode { position: absolute; z-index: 5; left: 50%; bottom: calc(var(--u) * 5); transform: translateX(-50%); border-color: var(--warm); color: var(--warm); font-size: calc(var(--u) * 4.2); padding: calc(var(--u) * 1.2) calc(var(--u) * 4); }
button:focus-visible { outline: calc(var(--u) * 0.6) solid var(--warm); outline-offset: calc(var(--u) * 0.5); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="216" height="384" aria-label="Pixel-art scene"></canvas>
    <div id="bar"><button id="prev" type="button" aria-label="Previous scene">&lsaquo;</button><p id="name" class="shade"></p><button id="next" type="button" aria-label="Next scene">&rsaquo;</button></div>
    <button id="mode" type="button" aria-pressed="true">Upgraded</button>
  </div>
</div>
<script>
/* Reach vignettes: flat 2D scenes, old rules vs upgraded rules.
   Upgrades: warm/cool split by light source, light pools with flicker, two-light rims, layered atmospheric
   depth with parallax, purposeful particles, palette-cycled shimmer, foreground framing, vignette. */
(function () {
'use strict';
const IS_BROWSER = typeof window !== 'undefined' && typeof document !== 'undefined';
const W = 216, H_MIN = 384, H_MAX = 470;
let H = H_MIN;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 1, 982451653); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y, s, o) { let f = 0, a = 0.5, t = 0; for (let i = 0; i < o; i++) { f += a * vnoise(x, y, s + i * 131); t += a; x *= 2.02; y *= 2.02; a *= 0.5; } return f / t; }
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
function dith(f, x, y) { const fl = Math.floor(f); let fr = f - fl; fr = fr < 0.28 ? 0 : fr > 0.72 ? 1 : (fr - 0.28) / 0.44; return fl + (fr > BAYER[((y & 3) << 2) | (x & 3)] ? 1 : 0); }
function genRidge(pts, rough, seed) {

  function sub(a, l, r) { if (r - l < 2) return; const m = (l + r) >> 1; a[m] = lerp(a[l], a[r], (m - l) / (r - l)) + (rng() - 0.5) * (r - l) * rough; sub(a, l, m); sub(a, m, r); }
  for (let k = 0; k < pts.length - 1; k++) { const ax = pts[k][0], n = pts[k + 1][0] - ax; if (n <= 0) continue; const s = new Float32Array(n + 1); s[0] = pts[k][1]; s[n] = pts[k + 1][1]; sub(s, 0, n); for (let i = 0; i <= n; i++) ys[ax - x0 + i] = s[i]; }
  return x => ys[clamp(Math.round(x) - x0, 0, ys.length - 1)];
}

// ---------------------------------------------------------------- palettes: per scene a cool ramp (12) and a warm ramp (8)
const hexc = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const SCN = [
  { name: 'Knight\u2019s camp by the river', cool: ['#05060d', '#0a0e1c', '#0f1729', '#152137', '#1c2c46', '#263a56', '#324a66', '#415c76', '#566f86', '#708796', '#8fa2aa', '#b9c4c0'], warm: ['#2a0e0b', '#4a160d', '#6e2410', '#963714', '#bd5418', '#dc7a24', '#f0a53a', '#fbd878'], acc: ['#f2f0dc', '#fff3c4'] },
  { name: 'The castle of the Order at dusk', cool: ['#0b0816', '#140f24', '#1d1732', '#282040', '#342a4e', '#43365c', '#56446a', '#6b5579', '#836a88', '#9d8198', '#b99aa8', '#d6b9b8'], warm: ['#3a1410', '#5c1f14', '#83301a', '#a8461f', '#cb6526', '#e58a33', '#f6b24c', '#ffe08a'], acc: ['#fff6d6', '#ffd27a'] },
  { name: 'Still Water at dawn', cool: ['#070c14', '#0d1624', '#142236', '#1c3048', '#263f5a', '#32506b', '#41627b', '#55768b', '#6d8c9c', '#89a5ae', '#aac0c0', '#d0dcd4'], warm: ['#3a1a1a', '#5e2a22', '#86402c', '#ad5a35', '#cf7b40', '#e9a052', '#f8c86c', '#fff0b0'], acc: ['#fffbe8', '#ffe2a0'] },
];
const PAL = new Uint32Array(128);
const STRIDE = 40;
function buildPal(dim) {
  const k = 1 - dim;
  SCN.forEach((s, i) => {
    const o = i * STRIDE;
    // the old rule: one hue-shifting ramp, cool darks into warm lights
    const old = s.cool.slice(0, 7).concat(s.warm.slice(3, 8));
    const set = (j, h) => { const c = hexc(h); PAL[o + j] = (0xff000000 | (((c[2] * k) | 0) << 16) | (((c[1] * k) | 0) << 8) | ((c[0] * k) | 0)) >>> 0; };
    s.cool.forEach((h, j) => set(j, h)); s.warm.forEach((h, j) => set(12 + j, h)); s.acc.forEach((h, j) => set(20 + j, h)); old.forEach((h, j) => set(22 + j, h));
  });
}
let NEW = true, O = 0, IDX = null, OUT32 = null;
// a cool value 0..11, a warm value 0..7; in old mode both land on the single combined ramp
const C = (v, x, y) => { const k = clamp(dith(v, x, y), 0, 11); return NEW ? O + k : O + 22 + k; };
const Wm = (v, x, y) => { const k = clamp(dith(v, x, y), 0, 7); return NEW ? O + 12 + k : O + 22 + clamp(k + 4, 0, 11); };
const put = (x, y, i) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < W && y >= 0 && y < H) IDX[y * W + x] = i; };
function glints(cx, y0, y1, w0, grow, idx, t, dens) {
  for (let y = y0; y < y1; y++) {
    const w = w0 + (y - y0) * grow, row = (t * 3 + y * 0.37) | 0;
    for (let k = 0; k < 4; k++) {
      if (hash2(k, y, row) > dens) continue;
      const x = Math.round(cx + (hash2(k, y, row + 7) - 0.5) * 2 * w), len = 1 + Math.round(hash2(k, y, row + 3) * (2 + (y - y0) * 0.06));

    }
  }
}
function vignette() {
  if (!NEW) return;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2), d = dx * dx * 0.8 + dy * dy * 0.6;
    if (d > 0.72 && BAYER[((y & 3) << 2) | (x & 3)] < (d - 0.72) * 2.2) { const i = y * W + x, v = IDX[i] - O; if (v > 0 && v < 12) IDX[i] = O + v - 1; else if (v > 12 && v < 20) IDX[i] = O + v - 1; }
  }
}
function sprite(rows, map) { const h = rows.length, w = rows[0].length, d = new Uint8Array(w * h).fill(255); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = map[rows[y][x]]; if (v !== undefined) d[y * w + x] = v; } return { w, h, d }; }
// rim light on a silhouette from one or two lights: returns per-pixel 0 body, 1 warm rim, 2 cool rim
function rims(s, warmDir, coolDir) {
  const op = (x, y) => x >= 0 && y >= 0 && x < s.w && y < s.h && s.d[y * s.w + x] !== 255;
  const out = new Uint8Array(s.w * s.h).fill(255);
  for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
    if (!op(x, y)) continue;
    let r = 0;
    if (coolDir && !op(x + coolDir[0], y + coolDir[1])) r = 2;
    if (warmDir && !op(x + warmDir[0], y + warmDir[1])) r = 1;
    out[y * s.w + x] = r;
  }
  return out;
}

// ---------------------------------------------------------------- 1. the knight's camp: warm fire against the cool night
const SIT = sprite([
  '....###.........', '...#####........', '...#####........', '...####.........', '....##..........', '..######........', '.########.......', '.#########......',
  '.#########......', '.#########......', '.##########.....', '..#########.##..', '..##########.#..', '..######...###..', '..######....##..', '.#######.....#..',
  '.########...........'.slice(0, 16), '..##..####......', '..##....###.....', '..##......##....', '.###.......##...'], { '#': 1 });
const SIT_RIM_NEW = rims(SIT, [-1, 0], [0, -1]), SIT_RIM_OLD = rims(SIT, null, [0, -1]);
let camp = null;
function buildCamp() {
  const trees = genRidge([[0, 196], [40, 188], [80, 194], [120, 186], [160, 192], [216, 187]], 0.3, 3);
  const pines = []; const rng = mulberry32(9);
  for (let x = 2; x < W; x += 5 + rng() * 6) pines.push([x, trees(x) - 6 - rng() * 16, 4 + rng() * 4]);
  camp = { trees, pines, stars: Array.from({ length: 70 }, () => [rng() * W, rng() * 150, rng()]) };
}
function drawCamp(t) {
  const MX = 162, MY = 46, FX = 96, FY = 300, WY = 206, BANK = 246;
  const fl = 1 + Math.sin(t * 11) * 0.05 + Math.sin(t * 7.3) * 0.04;          // flicker
  for (let y = 0; y < WY; y++) for (let x = 0; x < W; x++) {                  // sky
    const d2 = (x - MX) ** 2 + (y - MY) ** 2;
    let v = 0.6 + 3.2 * (y / WY) + 2.6 * Math.exp(-d2 / 500) + 1.2 * Math.exp(-d2 / 6000);
    IDX[y * W + x] = C(v, x, y);
  }
  for (const [sx, sy, p] of camp.stars) { const tw = NEW ? Math.sin(t * (1 + p * 3) + p * 20) > 0.3 : true; if (tw) put(sx, sy, C(p > 0.8 ? 10 : 8, 0, 0)); }
  for (let y = MY - 6; y <= MY + 6; y++) for (let x = MX - 6; x <= MX + 6; x++) if ((x - MX) ** 2 + (y - MY) ** 2 <= 30) put(x, y, O + (NEW ? 20 : 22 + 11));
  for (let x = 0; x < W; x++) for (let y = Math.max(0, Math.ceil(camp.trees(x))); y < WY; y++) IDX[y * W + x] = C(NEW ? 1.4 : 1, x, y);   // treeline
  for (const [px, py, pw] of camp.pines) for (let j = 0; j < WY - py; j++) { const hw = Math.min(pw, j * 0.45); for (let dx = -hw; dx <= hw; dx++) put(px + dx, py + j, C(NEW ? 1.2 : 1, 0, 0)); }
  for (let y = WY; y < BANK; y++) {                                           // river, mirrored, with the moon's and fire's paths
    const sy = 2 * WY - 1 - y, rip = Math.round(Math.sin(y * 1.7 + t * 1.5) * 1.2);
    for (let x = 0; x < W; x++) { const v = IDX[clamp(sy, 0, H - 1) * W + clamp(x + rip, 0, W - 1)] - O; IDX[y * W + x] = NEW ? O + clamp((v < 12 ? v : 9) - 1, 0, 11) : O + 22 + clamp((v >= 22 ? v - 22 : v) - 1, 0, 11); }
  }
  glints(MX, WY + 1, BANK, 1.5, 0.12, () => C(10, 0, 0), t, 0.35);
  if (NEW) glints(FX, WY + 1, BANK, 1, 0.16, (x, y) => O + 12 + 4 + ((x + y + ((t * 8) | 0)) % 3), t * 1.3, 0.45);   // the fire's glow on the water
  const bank = genRidgeMemo();
  for (let x = 0; x < W; x++) for (let y = Math.ceil(bank(x)); y < H; y++) {       // the near bank, lit by the fire in steps
    const d = (Math.hypot((x - FX) * 1.1, (y - FY) * 2.2) + (vnoise(x * 0.15, y * 0.3, 8) - 0.5) * 14) / fl;
    let v = 2.2 + (hash2(x >> 1, y >> 1, 3) > 0.85 ? 0.8 : 0) - (y - BANK) * 0.004;
    const lv = 6.6 - d / 10 + (hash2(x >> 1, y >> 1, 3) > 0.85 ? 0.7 : 0);
    if (NEW && lv > 0.4 + BAYER[((y & 3) << 2) | (x & 3)] * 1.2) IDX[y * W + x] = Wm(lv, x, y);
    else IDX[y * W + x] = C(v + (!NEW && d < 40 ? 2 : 0), x, y);
  }
  // tent, lit on the side facing the fire
  for (let j = 0; j < 40; j++) for (let i = -j * 0.8; i <= j * 0.8; i++) {
    const x = Math.round(44 + i), y = 262 + j, facing = i > 0;
    if (y >= H) continue;
    IDX[y * W + x] = NEW ? (facing ? Wm(4.4 - Math.abs(i) * 0.04 - j * 0.02 + (Math.abs(i - j * 0.8) < 1 ? 1.2 : 0), x, y) : C(1.6, x, y)) : C(facing ? 3.2 : 1.6, x, y);
  }

  for (let i = -9; i <= 9; i++) { put(FX + i, FY + 3 + Math.abs(i) * 0.15, NEW ? O + 12 + 1 : C(1, 0, 0)); put(FX + i, FY + 4, NEW ? O + 12 : C(1, 0, 0)); }
  for (let k = 0; k < 5; k++) {
    const bx = FX - 6 + k * 3, hgt = 10 + Math.sin(t * 9 + k * 1.9) * 3 + (k === 2 ? 5 : 0);
    for (let j = 0; j < hgt; j++) { const hw = (1 - j / hgt) * 2.4; for (let dx = -hw; dx <= hw; dx++) put(bx + dx + Math.sin(t * 12 + j * 0.5 + k) * (j / hgt) * 1.5, FY + 2 - j, NEW ? O + 12 + clamp(7 - Math.round(j / hgt * 3 + Math.abs(dx) * 0.6), 3, 7) : C(clamp(11 - Math.round(j / hgt * 3), 8, 11), 0, 0)); }
  }
  if (NEW) for (let k = 0; k < 14; k++) {                                      // embers rising and fading
    const age = (t * 0.45 + k * 0.071) % 1, ex = FX + Math.sin(k * 7.1 + t * 1.3) * 10 * age + (k % 5 - 2) * 2, ey = FY - 8 - age * 90;
    if (age < 0.8) put(ex, ey, O + (age < 0.3 ? 21 : 12 + 6 - Math.round(age * 3)));

  const kx = 120, ky = FY - SIT.h + 5, rm = NEW ? SIT_RIM_NEW : SIT_RIM_OLD;

let BANKR = null; const genRidgeMemo = () => BANKR || (BANKR = genRidge([[0, 250], [60, 246], [120, 249], [180, 244], [216, 247]], 0.1, 5));

// ---------------------------------------------------------------- 2. the castle of the Order: layers melting into dusk
const CASTLE = sprite([
  '..................#.........................',
  '..................#.........................',
  '.................###........................',
  '.................###........................',
  '....#............###..............#.........',
  '...###...........#w#.............###........',
  '...###..........#####............###........',
  '...#w#..........#####............#w#........',
  '...###..........##w##............###........',
  '..#####..#.#....#####....#.#....#####.......',
  '..##w##..###...#######...###....##w##.......',
  '..#####..#w#...###w###...#w#....#####.......',
  '..#####..###...#######...###....#####...#.#.',
  '.#######.###..#########..###...#######..###.',
  '.###############w###w##############w####w##.',
  '.##########################################.',
  '.###w########w#############w########w######.',
  '############################################',
  '############################################',

let castle = null;
function buildCastle() {
  castle = {
    far: genRidge([[0, 150], [50, 130], [90, 142], [140, 124], [216, 140]], 0.35, 21),
    hill: genRidge([[0, 196], [60, 180], [110, 170], [160, 182], [216, 192]], 0.2, 22),
    wood: genRidge([[0, 232], [70, 222], [140, 230], [216, 220]], 0.25, 23),

function drawCastle(t) {
  const SX = 58, SY = 172, pan = NEW ? Math.sin(t * 0.12) * 6 : 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {                    // dusk: cool above, warm at the horizon
    const d2 = (x - SX) ** 2 * 0.3 + ((y - SY) * 2.4) ** 2, warm = Math.exp(-d2 / 6000) * smooth(40, 170, y);
    if (NEW && warm > 0.08 + BAYER[((y & 3) << 2) | (x & 3)] * 0.5) IDX[y * W + x] = Wm(1.5 + warm * 6.8, x, y);
    else IDX[y * W + x] = C(1.2 + 6.4 * Math.pow(y / 200, 1.4) + warm * 3, x, y);
  }
  const layer = (f, par, val, top) => { for (let x = 0; x < W; x++) { const tp = Math.ceil(f(x - pan * par)); for (let y = Math.max(0, tp); y < H; y++) IDX[y * W + x] = C(val + (NEW && y - tp < 1 ? 1.2 : 0), x, y); } };
  // each layer a step closer to the sky colour (old rules: all nearly the same dark)
  layer(castle.far, 0.2, NEW ? 7.4 : 3.2);
  layer(castle.hill, 0.45, NEW ? 5.2 : 2.6);
  const S2 = 2, cx = Math.round(64 - pan * 0.45), cy = Math.round(castle.hill(108) - CASTLE.h * S2 + 6);
  for (let j = 0; j < CASTLE.h * S2; j++) for (let i = 0; i < CASTLE.w * S2; i++) {
    const v = CASTLE.d[((j / S2) | 0) * CASTLE.w + ((i / S2) | 0)];
    if (v === 255) continue;
    const lit = v === 2 && ((i * 7 + j * 3 + ((t * (0.7 + (i % 3) * 0.3)) | 0)) % 9) !== 0;   // candle-lit windows, flickering
    const edge = CASTLE.d[((j / S2) | 0) * CASTLE.w + (((i - 1) / S2) | 0)] === 255 || j < 2;
    put(cx + i, cy + j, v === 2 ? (NEW ? (lit ? O + 12 + 7 : O + 12 + 5) : C(5, i, j)) : NEW ? (edge && i < 44 ? Wm(4, i, j) : C(2.2, cx + i, cy + j)) : C(2.6, cx + i, cy + j));
  }
  if (NEW) for (const [bx, by] of [[36, 0], [6, 8], [68, 8]]) for (let k = 0; k < 9; k++) for (let q = 0; q < 2; q++) put(cx + bx + 2 + k, cy + by + q + Math.round(Math.sin(t * 5 - k * 0.7) * 1), O + 12 + (k < 4 ? 6 : 5));   // banners
  layer(castle.wood, 0.75, NEW ? 3 : 2);
  if (NEW) for (let x = 0; x < W; x += 4) { const tp = castle.wood(x - pan * 0.75); for (let j = 0; j < 9; j++) { const hw = j * 0.5; for (let dx = -hw; dx <= hw; dx++) put(x + dx, tp - 8 + j, C(3, 0, 0)); } }
  layer(castle.near, 1, NEW ? 1.2 : 1.4);
  if (NEW) {
    for (let k = 0; k < 7; k++) {                                              // a flock crossing
      const bx = ((t * 9 + k * 9) % 300) - 40 + (k % 2) * 5, by = 90 + k * 3 + Math.sin(t * 2 + k) * 2, up = ((t * 6 + k) | 0) & 1;
      put(bx - 1, by - up, O + 1); put(bx, by, O + 1); put(bx + 1, by - up, O + 1);
    }
    for (let k = 0; k < 18; k++) { const x0 = (k * 29) % W, h = 18 + (k * 11) % 26; for (let j = 0; j < h; j++) put(x0 + Math.sin(t * 0.9 + k + j * 0.1) * (j / h) * 2, H - 1 - j, O); }
  }
}

// ---------------------------------------------------------------- 3. Still Water at dawn: mist, a pier, the sun's path
const FISHER = sprite(['...##.....', '..####....', '..####....', '...##.....', '..#####...', '.######...', '.#######..', '.#######..', '..######..', '..###.##..', '..###..##.', '.####...##'], { '#': 1 });
const FISH_RIM_NEW = rims(FISHER, [1, 0], [0, -1]), FISH_RIM_OLD = rims(FISHER, null, [0, -1]);
let lake = null;
function buildLake() { lake = { shore: genRidge([[0, 176], [50, 168], [100, 174], [160, 166], [216, 172]], 0.3, 31) }; }
function drawLake(t) {
  const SX = 150, SY = 178, WY = 180;
  for (let y = 0; y < WY; y++) for (let x = 0; x < W; x++) {
    const d2 = (x - SX) ** 2 * 0.3 + ((y - SY) * 2.6) ** 2, warm = Math.exp(-d2 / 5000) * smooth(60, 178, y);
    if (NEW && warm > 0.08 + BAYER[((y & 3) << 2) | (x & 3)] * 0.5) IDX[y * W + x] = Wm(1.8 + warm * 6.4, x, y);
    else IDX[y * W + x] = C(2.4 + 6.8 * Math.pow(y / WY, 1.3) + warm * 2.5, x, y);
  }
  for (let y = SY - 9; y <= SY; y++) for (let x = SX - 9; x <= SX + 9; x++) if ((x - SX) ** 2 + (y - SY) ** 2 <= 81) put(x, y, NEW ? O + 20 : O + 22 + 11);   // the sun, half risen
  for (let x = 0; x < W; x++) for (let y = Math.max(0, Math.ceil(lake.shore(x))); y < WY; y++) IDX[y * W + x] = C(NEW ? 3.6 + (x > SX - 40 && x < SX + 40 ? 1 : 0) : 2.4, x, y);
  for (let y = WY; y < H; y++) {                                               // the lake: mirror, darker with depth
    const sy = 2 * WY - 1 - y, rip = Math.round(Math.sin(y * 1.3 + t * 1.1) * (0.6 + (y - WY) * 0.01));
    for (let x = 0; x < W; x++) {
      if (sy < 0) { IDX[y * W + x] = C(2, x, y); continue; }
      const v = IDX[sy * W + clamp(x + rip, 0, W - 1)] - O;
      IDX[y * W + x] = NEW ? (v >= 12 && v < 20 ? O + Math.max(12, v - 1) : O + clamp((v < 12 ? v : 9) - 1 - Math.floor((y - WY) / 60), 0, 11)) : O + 22 + clamp((v >= 22 ? v - 22 : v) - 1, 0, 11);
    }
  }
  glints(SX, WY + 1, H, 2, 0.14, NEW ? (x, y) => O + 12 + 5 + ((x + y + ((t * 10) | 0)) % 3) : () => C(10, 0, 0), t, NEW ? 0.55 : 0.4);   // the sun's path
  if (NEW) for (let k = 0; k < 3; k++) {                                        // mist bands drifting over the water
    const my = 172 + k * 16, off = t * (3 + k * 2);
    for (let y = my; y < my + 7; y++) for (let x = 0; x < W; x++) {
      const m = vnoise((x + off) * 0.03, y * 0.2 + k * 5, 70 + k) * (1 - Math.abs(y - my - 3) / 4);
      if (m > 0.34 + BAYER[((y & 3) << 2) | (x & 3)] * 0.3) { const i = y * W + x, v = IDX[i] - O; if (v < 12) IDX[i] = O + clamp(v + 2, 0, 11); }
    }
  }
  // the pier: planks and posts with their reflections
  const PY = 236;
  for (let x = 96; x < W; x++) { put(x, PY, C(NEW ? 5 : 3, x, PY)); put(x, PY + 1, C(NEW ? 2.5 : 2, x, PY)); put(x, PY + 2, C(1, x, PY)); if (NEW && x % 6 === 0) put(x, PY, C(3.5, x, PY)); }
  for (let px = 100; px < W; px += 22) for (let j = 3; j < 26; j++) { put(px, PY + j, C(j < 14 ? 1 : 2.4, px, PY + j)); put(px + 1, PY + j, C(j < 14 ? 1.4 : 2.6, px, PY + j)); }
  // the fisher, warm rim from the sun, cool from the sky; the line and its ripples
  const fx = 104, fy = PY - FISHER.h, rm = NEW ? FISH_RIM_NEW : FISH_RIM_OLD;
  for (let j = 0; j < FISHER.h; j++) for (let i = 0; i < FISHER.w; i++) { const r = rm[j * FISHER.w + i]; if (r === 255) continue; put(fx + i, fy + j, r === 1 ? Wm(6, i, j) : r === 2 ? C(NEW ? 8 : 6, i, j) : C(0, i, j)); }
  const tipx = fx - 22, tipy = fy - 12;
  for (let k = 0; k <= 26; k++) put(fx + 2 - k * (24 / 26), fy + 4 - k * (16 / 26), C(0.5, 0, 0));
  for (let k = 0; k <= 40; k++) { const u = k / 40; put(tipx - u * 6, tipy + u * (PY + 14 - tipy) + Math.sin(u * 3.1) * 3, C(NEW ? 7 : 5, 0, 0)); }
  if (NEW) for (let k = 0; k < 2; k++) { const a = (t * 0.5 + k / 2) % 1, rr = 3 + a * 16; for (let q = 0; q < 6.28; q += 0.05) { const x = tipx - 6 + Math.cos(q) * rr, y = PY + 14 + Math.sin(q) * rr * 0.2; if (a < 0.8) put(x, y, C(8 - a * 4, x, y)); } }
  if (NEW) for (let k = 0; k < 22; k++) { const x0 = (k * 13) % 80, h = 20 + (k * 17) % 34; for (let j = 0; j < h; j++) put(x0 + Math.sin(t * 0.8 + k + j * 0.08) * (j / h) * 2.5, H - 1 - j, O); }
}

// ---------------------------------------------------------------- frame
const G = { t: 0, cur: 0, dim: 0, fade: 0, next: -1 };
const DRAW = [drawCamp, drawCastle, drawLake];
function init() { buildCamp(); buildCastle(); buildLake(); }
function setH(h) { H = h; IDX = new Uint8Array(W * H); BANKR = null; }
function select(i) { G.next = ((i % 3) + 3) % 3; G.fade = 0.0001; }
function setNew(v) { NEW = v; }
function update(dt) {
  G.t += dt;
  if (G.fade > 0) { G.fade += dt; if (G.next >= 0 && G.fade > 0.16) { G.cur = G.next; G.next = -1; UI.show(); } G.dim = G.fade < 0.16 ? G.fade / 0.16 : Math.max(0, 1 - (G.fade - 0.16) / 0.2); if (G.fade > 0.36) { G.fade = 0; G.dim = 0; } }
}
function render(t) {
  buildPal(G.dim);
  O = G.cur * STRIDE;
  DRAW[G.cur](t);
  vignette();
  for (let i = 0, n = W * H; i < n; i++) OUT32[i] = PAL[IDX[i]];
}
let UI = { show() {} };
function boot() {
  const $ = id => document.getElementById(id);
  UI = { show() { $('name').textContent = SCN[G.cur].name; $('mode').textContent = NEW ? 'Upgraded' : 'Old rules'; $('mode').setAttribute('aria-pressed', NEW ? 'true' : 'false'); } };
  init();
  const canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false }), stage = $('stage'), wrap = $('wrap');
  let IMG = null;
  function resize() {
    const aw = Math.max(1, wrap.clientWidth), ah = Math.max(1, wrap.clientHeight), nh = clamp(Math.round((W * ah) / aw), H_MIN, H_MAX);
    if (nh !== H || !IMG) { setH(nh); canvas.width = W; canvas.height = H; IMG = ctx.createImageData(W, H); OUT32 = new Uint32Array(IMG.data.buffer); }
    const sc = Math.min(aw / W, ah / H), sw = Math.floor(W * sc);
    stage.style.width = sw + 'px'; stage.style.height = Math.floor(H * sc) + 'px';
    document.documentElement.style.setProperty('--u', sw / 100 + 'px');
  }
  window.addEventListener('resize', resize); resize(); UI.show();
  $('prev').addEventListener('click', () => select(G.cur - 1));
  $('next').addEventListener('click', () => select(G.cur + 1));
  $('mode').addEventListener('click', () => { NEW = !NEW; UI.show(); });
  window.addEventListener('keydown', e => { if (e.code === 'ArrowRight') select(G.cur + 1); else if (e.code === 'ArrowLeft') select(G.cur - 1); else if (e.code === 'Space') { NEW = !NEW; UI.show(); e.preventDefault(); } });
  let last = 0;
  function frame(ts) { const now = ts / 1000; let dt = last ? now - last : 1 / 60; last = now; update(clamp(dt, 0, 0.1)); render(G.t); ctx.putImageData(IMG, 0, 0); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}
if (IS_BROWSER) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); }
else if (typeof module !== 'undefined') module.exports = { init, setH, update, render, select, setNew, G, W, get H() { return H; }, setOut(b) { OUT32 = b; } };
})();

</script>
