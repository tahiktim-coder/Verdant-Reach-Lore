<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Souls games pixel-art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e9e5dd; --ink: #16151a; --muted: #6a665e; --frame: #d6d0c5;
}
@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] { --bg: #000000; --ink: #e9e5dd; --muted: #8b877e; --frame: #0d0d0f; }

*, *::before, *::after { box-sizing: inherit; }
body {

  font-family: 'Pixelify Sans', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  -webkit-font-smoothing: antialiased;

figure { margin: 52px 0 0; }
.frame { position: relative; margin: 0 auto; width: min(100%, 576px); aspect-ratio: 1; background: var(--frame); }
canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
.wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.ready .wait { display: none; }
figcaption { margin: 12px auto 0; font-size: 19px; }
</style>
</head>

  </header>

    <figcaption>The tower</figcaption>
  </figure>
  <figure>
    <div class="frame" data-scene="city"><canvas width="216" height="216" aria-label="A cathedral city at sunset under storm clouds, with two bridges over a river"></canvas><div class="wait">drawing…</div></div>
    <figcaption>The city</figcaption>
  </figure>

    <div class="frame" data-scene="wolf"><canvas width="216" height="216" aria-label="A giant wolf in a misty moonlit pine forest facing a small cloaked figure with a sword"></canvas><div class="wait">drawing…</div></div>
    <figcaption>The wolf</figcaption>
  </figure>

    const oA = Math.floor(t * 2.4) % TW, oB = Math.floor(t * 1.3) % TW;
    for (let y = 0; y < H; y++) {
      const pr = prof[y], rA = y * TW, rB = ((y + 30) % H) * TW;
      for (let x = 0; x < W; x++) {
        const i = y * W + x, d = DEP[i];
        let v = BASE[i];
        if (d > 0 && v <= N) {
          const m = MIST[rA + ((x + oA) % TW)] * 0.6 + MIST[rB + ((x + TW - oB) % TW)] * 0.4;
          let a = baseFog[d] * (0.4 + pr) + (m - 0.42) * amp[d] * 2.2 * pr;
          if (d === 4 && y > 136) a += Math.pow((y - 136) / 30, 1.3) * 0.34;
          a = clamp(a, 0, d >= 3 ? 0.5 : 0.8);
          if (a > 0.02) v = ci(sd(v + (FOG - v) * a, x, y));
        }
        IDX[i] = v;
      }
    }
    IDX[EYE[1] * W + EYE[0]] = Math.sin(t * 1.3) > -0.3 ? 20 : 13;
    for (const m of motes) {
      m.x += (m.vx + Math.sin(t * 0.7 + m.ph) * 1.5) * dt; m.y += m.vy * dt;
      if (m.y < 30) { m.y = 210; m.x = Math.random() * W; }
      if (m.x < 0) m.x += W; if (m.x >= W) m.x -= W;
      const tw = Math.sin(t * 2 + m.ph);
      if (tw > -0.2) { const x = Math.round(m.x), y = Math.round(m.y); if (y >= 0 && y < H) IDX[y * W + x] = tw > 0.6 ? 15 : 13; }
    }
    for (let i = 0; i < W * H; i++) out[i] = P.u32[IDX[i]];
  }
  return { W, H, frame };
}

const SCENES = { tower: sceneTower, city: sceneCity, wolf: sceneWolf };
const api = { S, SCENES };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
else root.SoulsArt = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function () {
  const A = window.SoulsArt, S = A.S;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = Array.from(document.querySelectorAll('[data-scene]')).map(el => {
    const cv = el.querySelector('canvas');
    return { el, cv, ctx: cv.getContext('2d'), name: el.dataset.scene, scene: null, busy: false, visible: false, last: 0, t0: 0, size: 216 };
  });
  function fit() {
    const dpr = window.devicePixelRatio || 1;
    for (const it of items) {
      const avail = Math.min(it.el.parentElement.clientWidth, 864);
      const k = Math.max(1, Math.floor(avail * dpr / it.size));
      const css = Math.min(avail, (it.size * k) / dpr);
      it.el.style.width = css + 'px';
      it.el.style.height = css + 'px';
    }
  }
  function draw(it, t) {
    it.scene.frame(t, it.out);
    it.ctx.putImageData(it.img, 0, 0);
  }
  function build(it) {
    it.busy = true;
    setTimeout(() => {
      it.scene = A.SCENES[it.name]();
      it.cv.width = it.scene.W; it.cv.height = it.scene.H; it.size = it.scene.W; fit();
      it.img = it.ctx.createImageData(it.scene.W, it.scene.H);
      it.out = new Uint32Array(it.img.data.buffer);
      it.t0 = performance.now() / 1000 - 4;
      draw(it, 4);
      it.el.classList.add('ready');
    }, 40);
  }
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const it = items.find(i => i.el === e.target);
      it.visible = e.isIntersecting;
      if (e.isIntersecting && !it.busy) build(it);
    }
  }, { rootMargin: '320px 0px' });
  items.forEach(it => io.observe(it.el));
  fit();
  window.addEventListener('resize', fit);
  function loop(ts) {
    const now = ts / 1000;
    if (!reduce) for (const it of items) {
      if (!it.scene || !it.visible || ts - it.last < 33) continue;
      it.last = ts;
      draw(it, now - it.t0);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
