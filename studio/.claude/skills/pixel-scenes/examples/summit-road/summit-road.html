<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>The Summit Road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); --page-bg: #07070f; --ink: #eef6e4; --dim: #a9c9b2; --glow: #8ff0b4; --u: 3.6px; --font: 'Pixelify Sans', 'VT323', 'Courier New', ui-monospace, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #05050b; } }
:root[data-theme="dark"] { --page-bg: #05050b; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body { height: 100%; background: var(--page-bg); color: var(--ink); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
#wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#stage { position: relative; overflow: hidden; width: 216px; height: 384px; cursor: pointer; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
.shade { text-shadow: 0 0 calc(var(--u) * 1.4) #05050b, 0 calc(var(--u) * 0.35) 0 #05050b; }
#mute { position: absolute; z-index: 5; top: calc(var(--u) * 3); right: calc(var(--u) * 4); font: inherit; font-size: calc(var(--u) * 3.3); color: var(--dim); background: transparent; border: calc(var(--u) * 0.45) solid #35525b; padding: calc(var(--u) * 0.6) calc(var(--u) * 1.8); cursor: pointer; }
#mute:focus-visible { outline: calc(var(--u) * 0.6) solid var(--glow); outline-offset: calc(var(--u) * 0.5); }
#caption { position: absolute; z-index: 5; left: 8%; right: 8%; bottom: 7%; margin: 0; text-align: center; font-size: calc(var(--u) * 4.2); line-height: 1.35; color: var(--ink); opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
#caption.on { opacity: 1; }
#title { position: absolute; z-index: 7; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; opacity: 0; transition: opacity 1.4s ease; pointer-events: none; }
#title.on { opacity: 1; }
#title h1 { margin: 58% 0 0; font-size: calc(var(--u) * 11); font-weight: 600; line-height: 1; color: var(--ink); }
#title .sub { margin: calc(var(--u) * 2.4) 0 0; font-size: calc(var(--u) * 4); color: var(--dim); }
#title .begin { position: absolute; bottom: 9%; left: 0; right: 0; margin: 0; font-size: calc(var(--u) * 4.4); color: var(--glow); animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { #title .begin { animation: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage" aria-label="The Summit Road: a warrior walks an endless mountain road toward a summit crowned with green lightning. Tap for lightning.">
    <canvas id="c" width="216" height="384"></canvas>
    <button id="mute" type="button" aria-pressed="false">Sound on</button>
    <p id="caption" class="shade" aria-live="polite"></p>
    <div id="title" class="shade">
      <h1>The Summit Road</h1>
      <p class="sub">A legend from before the Old Age</p>
      <p class="begin">Tap to begin</p>
    </div>
  </div>
</div>
<script>
/* The Summit Road: the cursed warrior still walking the endless mountain of Old magic.
   New techniques on top of the Still Water rules: voxel-space terrain, depth fog in ramp space, god rays,
   an animated cloud sea, lightning with a palette flash, palette cycling on the blade, a walk cycle. */
(function () {
'use strict';
const IS_BROWSER = typeof window !== 'undefined' && typeof document !== 'undefined';
const W = 216, H_MIN = 384, H_MAX = 470;
let H = H_MIN;
const HZ = 150, FOC = 150, CX = 108;
const SX = 108, SY = 27;                       // the summit's crown of green lightning: the light in frame
const SLOPE = 0.035;

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash2(x, y, s) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 1, 982451653); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
function dith(f, x, y) { const fl = Math.floor(f); let fr = f - fl; fr = fr < 0.28 ? 0 : fr > 0.72 ? 1 : (fr - 0.28) / 0.44; return fl + (fr > BAYER[((y & 3) << 2) | (x & 3)] ? 1 : 0); }

// ---------------------------------------------------------------- palette: one cold ramp of Old magic, green fire accents
const hexc = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const RAMP = ['#07070f', '#0c0f1c', '#12192b', '#192438', '#213244', '#2a4150', '#35525b', '#436666', '#557c70', '#6e957d', '#94b290', '#cddab6'].map(hexc);
const ACC = ['#2e8f5f', '#6fe39c', '#c8ffd9', '#f2fff4'].map(hexc);              // 12..15
const PAL = new Uint32Array(16);
function buildPal(flash, dim) {
  const k = 1 - dim;
  for (let i = 0; i < 16; i++) {
    const c = i < 12 ? RAMP[i] : ACC[i - 12];
    const f = i < 12 ? flash * 0.16 : flash * 0.1;                                    // lightning lifts the whole ramp toward green-white
    const r = clamp((c[0] + (170 - c[0] * 0.3) * f) * k, 0, 255), g = clamp((c[1] + (255 - c[1] * 0.2) * f) * k, 0, 255), b = clamp((c[2] + (200 - c[2] * 0.3) * f) * k, 0, 255);
    PAL[i] = (0xff000000 | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0)) >>> 0;
  }
}

// ---------------------------------------------------------------- tileable noise texture, sampled with scrolling offsets
const NS = 256, NT = new Float32Array(NS * NS);
function genNoise() {
  const per = (x, y, s, p) => hash2(((x % p) + p) % p, ((y % p) + p) % p, s);
  const pn = (x, y, s, p) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = per(xi, yi, s, p), b = per(xi + 1, yi, s, p), c = per(xi, yi + 1, s, p), d = per(xi + 1, yi + 1, s, p);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  for (let y = 0; y < NS; y++) for (let x = 0; x < NS; x++) {
    let f = 0, amp = 0.5, tot = 0, p = 6;
    for (let o = 0; o < 5; o++) { f += amp * pn((x / NS) * p, (y / NS) * p, 11 + o, p); tot += amp; amp *= 0.5; p *= 2; }
    NT[y * NS + x] = f / tot;
  }
}
function nt(u, v) {
  u -= Math.floor(u); v -= Math.floor(v);
  const x = u * NS, y = v * NS, xi = x | 0, yi = y | 0, fx = x - xi, fy = y - yi;
  const x1 = (xi + 1) & (NS - 1), y1 = (yi + 1) & (NS - 1);
  const a = NT[yi * NS + xi], b = NT[yi * NS + x1], c = NT[y1 * NS + xi], d = NT[y1 * NS + x1];
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}

// ---------------------------------------------------------------- the mountain: a symmetric ridge of ancient terraces
function rawH(X, Z) { return Z * SLOPE - 0.02 * X * X; }
function terr(X, Z) {
  const raw = rawH(X, Z), q = raw / 5, f = q - Math.floor(q);
  const stepped = (Math.floor(q) + smooth(0.82, 1.0, f)) * 5;
  return raw + (stepped - raw) * smooth(4, 7, Math.abs(X));                // the path itself climbs smoothly
}
const cloudTop = (Z, X, t) => Z * SLOPE - 28 + (nt(X * 0.004 + t * 0.004, Z * 0.004) - 0.5) * 8;

// ---------------------------------------------------------------- buffers
let VAL = null, OCC = null, IDX = null, OUT32 = null, RAY = null, RW = 0, RH = 0;
function setH(h) {
  H = h;
  VAL = new Float32Array(W * H); OCC = new Uint8Array(W * H); IDX = new Uint8Array(W * H);
  RW = W >> 1; RH = H >> 1; RAY = new Float32Array(RW * RH);
}

// ---------------------------------------------------------------- sky, storm banks and the summit
function summitHalfW(y) { const k = (y - SY - 3) / (HZ - SY); return k < 0 ? -1 : 1.5 + k * 30 + k * k * 58; }
let SKYV = null, SKYO = null, skyTick = 0;
function renderSky(t, flash) {
  if (skyTick++ % 3 === 0 || !SKYV) buildSky(t);
  for (let i = 0, n = Math.min(H, HZ + 8) * W; i < n; i++) { VAL[i] = SKYV[i] + (SKYO[i] ? 0 : flash * 1.1); OCC[i] = SKYO[i]; }
}
function buildSky(t) {
  const flash = 0;
  if (!SKYV) { SKYV = new Float32Array(W * (HZ + 8)); SKYO = new Uint8Array(W * (HZ + 8)); }
  for (let y = 0; y < HZ + 8 && y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, dx = x - SX, dy = y - SY, d2 = dx * dx + dy * dy * 1.4, ax = Math.abs(dx);
    let f = 0.8 + 4.8 * Math.pow(Math.min(1, y / HZ), 1.5) + 3.2 * Math.exp(-d2 / 260) + 1.7 * Math.exp(-d2 / 4200);
    let occ = 1;
    // storm banks, mirrored about the summit and flowing outward from it
    const band = smooth(6, 30, y) * (1 - smooth(92, 128, y));
    if (band > 0) {
      const n = nt(ax / 260 - t * 0.006, y / 170) * 0.7 + nt(ax / 95 - t * 0.012, y / 70 + 0.37) * 0.3;
      const d = n * band - 0.08 * Math.exp(-d2 / 900);
      if (d > 0.46) {
        const m = nt((ax - 3) / 260 - t * 0.006, (y - 2) / 170) * 0.7 + nt((ax - 3) / 95 - t * 0.012, (y - 2) / 70 + 0.37) * 0.3;
        const lit = (n - m) * band;                                        // the side facing the crown catches it
        f = 1.9 + 2.0 * Math.exp(-d2 / 5000) + (lit < -0.004 ? 2.4 * Math.exp(-d2 / 9000) + 0.8 : 0) + (d < 0.5 ? -0.5 : 0) + flash * 1.2;
        occ = 0;
      }
    }
    // the summit: colossal, hazy, a spire with faint ancient bands, rimmed by its own crown
    const hw = summitHalfW(y);
    if (hw > 0 && ax < hw) {
      const edge = hw - ax;
      f = 4.1 + 0.9 * Math.min(1, y / HZ) + (edge < 1.3 && y < SY + 60 ? 2.4 : 0) + ((y - SY) % 9 < 1 && edge > 2 ? 0.5 : 0) + flash * 1.5;
      occ = 0;
    }
    SKYV[i] = f; SKYO[i] = occ;
  }
}

// ---------------------------------------------------------------- voxel-space terrain and cloud sea, front to back per column
const CAM = { z: 400 };
function renderTerrain(t, flash) {
  const camZ = CAM.z, camY = camZ * SLOPE + 6;
  for (let x = 0; x < W; x++) {
    let yb = H;
    const dx = (x + 0.5 - CX) / FOC;
    let z = 3;
    while (z < 3400 && yb > 0) {
      const X = dx * z, Zw = camZ + z;
      let h = terr(X, Zw), cloud = false;
      if (h < Zw * SLOPE - 22) { const ct = cloudTop(Zw, X, t); if (h < ct) { h = ct; cloud = true; } }
      const sy = Math.floor(HZ + ((camY - h) * FOC) / z);
      if (sy < yb) {
        let v;
        if (cloud) {
          const n = nt(X * 0.0032 + t * 0.005, Zw * 0.0032);
          const m = nt(X * 0.0032 + t * 0.005, Zw * 0.0032 + 0.004);
          v = 3.2 + n * 2.6 + (n - m > 0 ? 1.1 : -0.3) + 1.4 * Math.exp(-(x - SX) * (x - SX) / 2600) + flash * 0.6;
        } else {
          const ax = Math.abs(X), raw = rawH(X, Zw), q = raw / 5, fq = q - Math.floor(q);
          if (ax < 3.2) {                                                                   // the paved road: slabs, worn joints
            v = 5.8 + (hash2(Math.floor((X + 3.2) / 2.13), Math.floor(Zw / 4), 9) - 0.5) * 0.8 + (Zw % 4 < 0.35 ? -1.3 : 0);
            if (z < 90 && ((X + 3.2) / 2.13) % 1 < 0.06) v -= 1.0 * (1 - z / 90);
          }
          else if (ax < 4.2) v = 3.8;
          else if (fq > 0.84) v = 2.4 + (ax > 60 ? -0.4 : 0);                               // risers face away from the light
          else if (fq > 0.8) v = 7.2;                                                       // each tread's lip catches the crown
          else {
            v = 4.8 + 0.7 * Math.exp(-ax / 20) + (hash2(Math.floor(X / 3), Math.floor(Zw / 3), 7) - 0.5) * 0.9;
            if (z < 160) { const jx = X / 3 - Math.floor(X / 3), jz = Zw / 3 - Math.floor(Zw / 3); if (jx < 0.07 || jz < 0.07) v -= 0.9 * (1 - z / 160); }
          }
          v += flash * 0.7;
        }
        const fa = 1 - Math.exp(-z / 650);
        v += (5.9 + flash * 0.5 - v) * fa;                                                        // depth fog in ramp space
        const y0 = sy < 0 ? 0 : sy;
        for (let y = y0; y < yb; y++) { const i = y * W + x; VAL[i] = v; OCC[i] = 0; }
        yb = sy;
      }
      z += 0.08 + z * (z < 200 ? 0.017 : 0.03);
    }
  }
}

// ---------------------------------------------------------------- relics: colossal blades left from the war of gods
function drawRelics(flash) {
  const camZ = CAM.z, camY = camZ * SLOPE + 6, step = 150;
  const first = Math.ceil((camZ + 25) / step) * step;
  for (let Z = first + step * 12; Z >= first; Z -= step) {
    const z = Z - camZ;
    for (const side of [-1, 1]) {
      const X = side * (24 + (hash2(Z, side, 3) - 0.5) * 6), base = terr(X, Z);
      const sx = CX + (X * FOC) / z, sy = HZ + ((camY - base) * FOC) / z, sc = FOC / z;
      const lean = side * (0.16 + hash2(Z, side, 5) * 0.12), len = 17 * sc, wide = Math.max(1, 1.1 * sc);
      const fa = 1 - Math.exp(-z / 650), v = 1.6 + (5.9 - 1.6) * fa;
      const tx = sx + lean * len, ty = sy - len;
      const n = Math.ceil(len) + 1;
      for (let k = 0; k <= n; k++) {                                     // blade, tapering into the ground
        const u = k / n, cx = sx + (tx - sx) * u, cy = sy + (ty - sy) * u, hw = wide * (0.4 + 0.6 * u);
        for (let dx = -Math.ceil(hw); dx <= Math.ceil(hw); dx++) {
          const x = Math.round(cx + dx), y = Math.round(cy);
          if (x < 0 || x >= W || y < 0 || y >= H) continue;
          VAL[y * W + x] = v + (dx === -Math.ceil(hw) * side && z < 400 ? 1.6 * (1 - fa) : 0) + flash * 0.4;
          OCC[y * W + x] = 0;
        }
      }
      const gw = 3.2 * sc, gy = ty + 0.08 * len * 0 ;                      // crossguard and hilt
      for (let dx = -Math.ceil(gw); dx <= Math.ceil(gw); dx++) {
        const x = Math.round(tx + dx), y = Math.round(gy + 1);
        if (x >= 0 && x < W && y >= 0 && y < H) { VAL[y * W + x] = v; OCC[y * W + x] = 0; }
      }
      for (let k = 1; k <= Math.ceil(2.6 * sc); k++) { const x = Math.round(tx + lean * k * 0.3), y = Math.round(gy - k); if (x >= 0 && x < W && y >= 0 && y < H) { VAL[y * W + x] = v; OCC[y * W + x] = 0; } }
    }
  }
}

// ---------------------------------------------------------------- god rays: radial blur of the clear-sky mask toward the crown
let rayTick = 0;
function renderRays(flash) {
  const N = 10;
  if (rayTick++ & 1) { applyRays(flash); return; }
  for (let hy = 0; hy < RH; hy++) for (let hx = 0; hx < RW; hx++) {
    const px = hx * 2 + 1, py = hy * 2 + 1;
    let acc = 0, wsum = 0, wgt = 1;
    for (let k = 0; k < N; k++) {
      const u = k / N, sx = Math.round(px + (SX - px) * u * 0.9), sy = Math.round(py + (SY - py) * u * 0.9);
      if (sy >= 0 && sy < H) acc += OCC[sy * W + sx] * wgt;
      wsum += wgt; wgt *= 0.93;
    }
    RAY[hy * RW + hx] = (acc / wsum) * Math.exp(-Math.hypot(px - SX, (py - SY) * 0.8) / 170);
  }
  applyRays(flash);
}
function applyRays(flash) {
  const gain = 2.6 + flash * 1.2;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const r = RAY[Math.min(RH - 1, y >> 1) * RW + Math.min(RW - 1, x >> 1)];
    if (r > 0.02) VAL[y * W + x] += r * gain * (y > HZ ? 0.55 : 1);
  }
}

// ---------------------------------------------------------------- the walker: a hand-drawn four-frame walk, seen from behind
const WMAP = { '#': 0, 'c': 1 };
const WALK = [
  ['.....##.....', '....####....', '....####....', '.....##.....', '..########..', '.##########.', '.##########.', '.##########.', '.###cccc###.', '.##cccccc##.', '..#cccccc#..', '..########..', '..########..', '...######...', '...##..##...', '...##..##...', '...##..##...', '..##...##...', '..##....##..', '..##....##..', '..#.....##..', '.##......#..', '.##......##.', '..........#.'],
  ['.....##.....', '....####....', '....####....', '.....##.....', '..########..', '.##########.', '.##########.', '.##########.', '.###cccc###.', '.##cccccc##.', '..#cccccc#..', '..########..', '..########..', '...######...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '..###..###..', '............', '............'],
  ['.....##.....', '....####....', '....####....', '.....##.....', '..########..', '.##########.', '.##########.', '.##########.', '.###cccc###.', '.##cccccc##.', '..#cccccc#..', '..########..', '..########..', '...######...', '...##..##...', '...##..##...', '...##..##...', '...##...##..', '..##....##..', '..##....##..', '..##.....#..', '..#......##.', '.##......##.', '.#..........'],
  ['.....##.....', '....####....', '....####....', '.....##.....', '..########..', '.##########.', '.##########.', '.##########.', '.###cccc###.', '.##cccccc##.', '..#cccccc#..', '..########..', '..########..', '...######...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '...##..##...', '..###..###..', '............', '............'],
].map(rows => {
  const h = rows.length, w = rows[0].length, data = new Uint8Array(w * h).fill(255);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const v = WMAP[rows[y][x]]; if (v !== undefined) data[y * w + x] = v; }
  // rim light from the crown ahead: top edges and outer sides glow
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && data[y * w + x] !== 255;
  const out = new Uint8Array(data);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (data[y * w + x] === 0 && (!op(x, y - 1) || (y < 12 && (!op(x - 1, y) || !op(x + 1, y))))) out[y * w + x] = 6;
  return { w, h, data: out };
});
function drawWalker(t) {
  const phase = (t * 1.7) % 4, f = phase | 0, bob = f === 0 || f === 2 ? -1 : 0;
  const s = WALK[f], x0 = CX - 6, feet = Math.round(HZ + ((6 - 12 * SLOPE) * FOC) / 12);
  const y0 = feet - s.h + 1 + bob;
  for (let j = 0; j < s.h; j++) for (let i = 0; i < s.w; i++) {
    const v = s.data[j * s.w + i];
    if (v !== 255) IDX[(y0 + j) * W + x0 + i] = v;
  }
  // cape hem sways
  for (let i = 1; i < 11; i++) if (Math.sin(t * 3 + i * 0.7) > 0.3) IDX[(y0 + 13) * W + x0 + i] = 0;
  // the sword in his right hand, blade trailing; its glow runs down the blade (palette cycling)
  const hx = x0 + 11, hy = y0 + 12, tx = x0 + 17, ty = feet + 1;
  const n = Math.max(Math.abs(tx - hx), Math.abs(ty - hy));
  for (let k = 0; k <= n; k++) {
    const x = Math.round(hx + ((tx - hx) * k) / n), y = Math.round(hy + ((ty - hy) * k) / n);
    IDX[y * W + x] = k < 2 ? 1 : 12 + ((k + ((t * 9) | 0)) % 3);
  }
  if (Math.sin(t * 5.3) > 0.6) IDX[(ty) * W + tx + 1] = 14;                      // sparks where the tip drags
}

// ---------------------------------------------------------------- lightning
const BOLTS = [];
let FLASH = 0;
function bolt(x0, y0, x1, y1, depth, rough) {
  if (depth === 0) return [[x0, y0], [x1, y1]];
  const mx = (x0 + x1) / 2 + (Math.random() - 0.5) * rough, my = (y0 + y1) / 2 + (Math.random() - 0.5) * rough * 0.5;
  const a = bolt(x0, y0, mx, my, depth - 1, rough * 0.55), b = bolt(mx, my, x1, y1, depth - 1, rough * 0.55);
  return a.concat(b.slice(1));
}
function strike(big) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const x0 = SX + side * (25 + Math.random() * 80), y0 = 8 + Math.random() * 40;
  const main = bolt(x0, y0, SX + (Math.random() - 0.5) * 6, SY + 3, 6, 34);
  const branches = [];
  for (let k = 0; k < 2; k++) {
    const p = main[4 + ((Math.random() * (main.length - 8)) | 0)];
    branches.push(bolt(p[0], p[1], p[0] + side * (10 + Math.random() * 25), p[1] + 8 + Math.random() * 20, 4, 12));
  }
  BOLTS.push({ lines: [main].concat(branches), t: 0, max: big ? 0.45 : 0.3 });
  FLASH = Math.max(FLASH, big ? 1 : 0.65);
  SFX.thunder(big);
}
function drawBolts() {
  for (const b of BOLTS) {
    if (((b.t * 30) | 0) % 3 === 1) continue;                                       // flicker
    b.lines.forEach((ln, li) => {
      for (let k = 0; k < ln.length - 1; k++) {
        const [x0, y0] = ln[k], [x1, y1] = ln[k + 1], n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
        for (let s = 0; s <= n; s++) {
          const x = Math.round(x0 + ((x1 - x0) * s) / n), y = Math.round(y0 + ((y1 - y0) * s) / n);
          if (x < 1 || x >= W - 1 || y < 1 || y >= H - 1) continue;
          IDX[y * W + x] = li === 0 ? 15 : 14;
          if (li === 0) { if (IDX[y * W + x + 1] < 12) IDX[y * W + x + 1] = 13; if (IDX[y * W + x - 1] < 12 && ((x + y) & 1)) IDX[y * W + x - 1] = 13; }
        }
      }
    });
  }
}

// ---------------------------------------------------------------- motes of Old magic
const MOTES = [];
function initMotes() { for (let k = 0; k < 36; k++) MOTES.push({ x: Math.random() * W, y: HZ + Math.random() * (H - HZ), sp: 3 + Math.random() * 6, ph: Math.random() * 6 }); }
function drawMotes(t, dt) {
  for (const m of MOTES) {
    m.y -= m.sp * dt; m.x += Math.sin(t * 0.8 + m.ph) * 0.15;
    if (m.y < 20) { m.y = H - 2; m.x = Math.random() * W; }
    if (Math.sin(t * 2 + m.ph * 3) > -0.2) { const x = Math.round(m.x), y = Math.round(m.y); if (x >= 0 && x < W) IDX[y * W + x] = m.y < HZ ? 13 : 12 + (m.ph > 3 ? 1 : 0); }
  }
}

// ---------------------------------------------------------------- frame
const G = { t: 0, phase: 'title', line: 0, next: 9, dim: 0, lastDt: 1 / 60 };
const LINES = [
  'He read the scroll so the sword could hurt no one.',
  'It was never an escape. It was a rally spell from the war of gods.',
  'It sends you to your allies. His allies fell an age before he was born.',
  'The sword will not let him die.',
  'So he walks. Green lightning marks the summit.',
  'He has been walking for a thousand years.',
];
function update(dt) {
  G.t += dt; G.lastDt = dt;
  CAM.z += 1.1 * dt;
  for (let k = BOLTS.length - 1; k >= 0; k--) { BOLTS[k].t += dt; if (BOLTS[k].t > BOLTS[k].max) BOLTS.splice(k, 1); }
  FLASH *= Math.exp(-dt * 5);
  if (Math.random() < dt * 0.35) strike(false);
  if (G.phase === 'play') { G.next -= dt; if (G.next <= 0) { UI.caption(LINES[G.line++ % LINES.length]); G.next = 11; } }
}
function render(t) {
  const flash = FLASH;
  buildPal(flash, G.dim);
  renderSky(t, flash);
  renderTerrain(t, flash);
  drawRelics(flash);
  renderRays(flash);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const v = dith(VAL[y * W + x], x, y); IDX[y * W + x] = v < 0 ? 0 : v > 11 ? 11 : v; }
  drawMotes(t, G.lastDt);
  drawWalker(t);
  drawBolts();
  for (let i = 0, n = W * H; i < n; i++) OUT32[i] = PAL[IDX[i]];
}
function tap() {
  if (G.phase === 'title') { G.phase = 'play'; UI.title(false); G.next = 1.5; SFX.init(); return; }
  strike(true);
  UI.caption(LINES[G.line++ % LINES.length]); G.next = 11;
}
function init() { genNoise(); initMotes(); }

// ---------------------------------------------------------------- sound
const SFX = {
  ctx: null, out: null, buf: null, muted: false,
  init() {
    if (this.ctx || !IS_BROWSER) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = new AC(); this.ctx = c;
      this.out = c.createGain(); this.out.gain.value = this.muted ? 0 : 0.7; this.out.connect(c.destination);
      const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.buf = b;
      const ws = c.createBufferSource(); ws.buffer = b; ws.loop = true;                           // high wind
      const wf = c.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 420; wf.Q.value = 0.6;
      const wg = c.createGain(); wg.gain.value = 0.05;
      const lfo = c.createOscillator(); lfo.frequency.value = 0.07; const lg = c.createGain(); lg.gain.value = 0.03;
      lfo.connect(lg); lg.connect(wg.gain); ws.connect(wf); wf.connect(wg); wg.connect(this.out); ws.start(); lfo.start();
      [55, 55.4, 82.4].forEach(f => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.value = 0.018; o.connect(g); g.connect(this.out); o.start(); });   // the mountain's hum
    } catch (e) { this.ctx = null; }
  },
  thunder(big) {
    const c = this.ctx; if (!c) return;
    const t = c.currentTime + 0.3 + Math.random() * 0.8, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.buf; f.type = 'lowpass'; f.frequency.setValueAtTime(big ? 380 : 240, t); f.frequency.exponentialRampToValueAtTime(50, t + 2.6);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(big ? 0.7 : 0.35, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random()); s.stop(t + 3);
  },
};

// ---------------------------------------------------------------- DOM
let UI = { caption() {}, title() {} };
function boot() {
  const $ = id => document.getElementById(id);
  let capTimer = null;
  UI = {
    caption(txt) { const el = $('caption'); el.textContent = txt; el.classList.add('on'); clearTimeout(capTimer); capTimer = setTimeout(() => el.classList.remove('on'), 5200); },
    title(on) { $('title').classList.toggle('on', on); },
  };
  init();
  const canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false }), stage = $('stage'), wrap = $('wrap');
  let IMG = null;
  function resize() {
    const aw = Math.max(1, wrap.clientWidth), ah = Math.max(1, wrap.clientHeight);
    const nh = clamp(Math.round((W * ah) / aw), H_MIN, H_MAX);
    if (nh !== H || !IMG) { setH(nh); canvas.width = W; canvas.height = H; IMG = ctx.createImageData(W, H); OUT32 = new Uint32Array(IMG.data.buffer); }
    const sc = Math.min(aw / W, ah / H), sw = Math.floor(W * sc);
    stage.style.width = sw + 'px'; stage.style.height = Math.floor(H * sc) + 'px';
    document.documentElement.style.setProperty('--u', sw / 100 + 'px');
  }
  window.addEventListener('resize', resize);
  resize();
  UI.title(true);
  stage.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button')) return; SFX.init(); if (SFX.ctx && SFX.ctx.state !== 'running') SFX.ctx.resume(); tap(); });
  window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); SFX.init(); tap(); } });
  $('mute').addEventListener('click', e => { e.stopPropagation(); SFX.init(); SFX.muted = !SFX.muted; if (SFX.ctx) SFX.out.gain.value = SFX.muted ? 0 : 0.7; $('mute').textContent = SFX.muted ? 'Sound off' : 'Sound on'; $('mute').setAttribute('aria-pressed', SFX.muted ? 'true' : 'false'); });
  document.addEventListener('visibilitychange', () => { if (SFX.ctx) { if (document.hidden) SFX.ctx.suspend(); else SFX.ctx.resume(); } });
  let last = 0, cost = 0, odd = false;
  function frame(ts) {
    const now = ts / 1000; let dt = last ? now - last : 1 / 60; last = now; dt = clamp(dt, 0, 0.1);
    update(dt);
    odd = !odd;
    if (cost < 12 || odd) { const a = performance.now(); render(G.t); ctx.putImageData(IMG, 0, 0); cost = cost * 0.9 + (performance.now() - a) * 0.1; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
if (IS_BROWSER) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); }
else if (typeof module !== 'undefined') {
  module.exports = { init, setH, update, render, tap, strike, G, CAM, W, get H() { return H; }, setOut(b) { OUT32 = b; } };
}
})();

</script>
