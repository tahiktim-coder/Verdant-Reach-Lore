  </div>

  ring: (u, v) => {

  sack: (u, v) => {

  seal: (u, v) => {
    const r = Math.hypot(u, v), blob = r - 0.78 - Math.sin(Math.atan2(v, u) * 9) * 0.05, stamp = Math.abs(u) - 0.24 * (1 - (v / 0.45) ** 2);

};
const SLOTS = [
  { key: 'blade', name: 'Verdant Blade', text: 'Plain steel, kept sharp. The Order forbids cursed blades, and everyone knows why.' },
  { key: 'shield', name: 'Leaf Kite', text: 'Every castle paints its own. This is the Order\u2019s leaf.' },
  { key: 'scroll', name: 'Rally Scroll (copy)', text: 'A copy of the scroll from the legend. No one has ever read it aloud.' },
  { key: 'ring', name: 'Signet of the Order', text: 'Worn on the oath hand. The stone is cold even in summer.' },
  { key: 'sack', name: 'Flour Sack', text: 'For the roads at harvest. Throw it hard, and don\u2019t stay to watch.' },
  { key: 'seal', name: 'Covenant Seal', text: 'The wax of the covenant. It has never cooled.' },
];
const STATS = [['blade', 'Might', 9], ['shield', 'Guard', 11], ['seal', 'Will', 7], ['scroll', 'Lore', 4]];

// ---------------------------------------------------------------- chrome and layout
let CHROME = null, IDX = null, OUT32 = null;
const LAY = {};
function box(buf, x0, y0, x1, y1, fill) {

    const e = x === x0 || y === y0 ? 9 : x === x1 || y === y1 ? 6 : x === x0 + 1 || y === y0 + 1 ? 8 : x === x1 - 1 || y === y1 - 1 ? 7 : fill;

}
function genChrome() {

  LAY.skills = [];
  for (let k = 0; k < 3; k++) {

    for (let y = -17; y <= 17; y++) for (let x = -17; x <= 17; x++) { const r = Math.hypot(x, y); if (r <= 17.5) CHROME[(cy + y) * W + cx + x] = OFF.ui + (r > 16.2 ? 9 : r > 15 ? 7 : 3); }
    const sym = [(u, v) => { const q = sBox(u, v, 0.05, 0, 0.1, 0.8, 0.5), t = sBox(u, v, -0.35, 0.55, 0.15, 0.12, 0.5); const dd = Math.min(q, t); return dd > 0.05 ? null : [dd, 'parch', 0]; },
      (u, v) => { const tw = sBox(u, v, 0, 0.1, 0.36, 0.62, 0), cr = Math.min(sBox(u, v, -0.26, -0.6, 0.1, 0.12, 0), sBox(u, v, 0.26, -0.6, 0.1, 0.12, 0), sBox(u, v, 0, -0.6, 0.08, 0.12, 0)); const dd = Math.min(tw, cr); return dd > 0.05 ? null : [dd, 'steel', 0.1]; },
      (u, v) => { const hs = Math.max(Math.abs(Math.hypot(u, v + 0.05) - 0.5) - 0.13, v - 0.45); return hs > 0.05 ? null : [hs, 'steel', 0.15]; }][k];
    drawIcon(CHROME, W, cx - 12, cy - 12, 24, sym);

}

// ---------------------------------------------------------------- frame
const G = { t: 0, sel: -1, glint: 0 };
let EYES = [];
function init() {
  buildBust(PW, PH, 36, 90, 150);
  EYES = [[-0.17, 1.9, 0.49], [0.13, 1.9, 0.49]].map(([mx, my, mz]) => { const x = mx * CY + mz * SY_, y = my; return [Math.round(90 + x * 36), Math.round(150 - y * 36)]; });
  ROOM_A = new Uint8Array(PW * PH); ROOM_B = new Uint8Array(PW * PH);
  paintRoom(ROOM_A, 1.0); paintRoom(ROOM_B, 0.78);
  shadeBust(ROOM_A, 1.0, 0, 0, PW); shadeBust(ROOM_B, 0.78, 0, 0, PW);
}
function setH(h) { H = h; IDX = new Uint8Array(W * H); genChrome(); }
function update(dt) { G.t += dt; if (G.glint > 0) G.glint -= dt; }
function render(t) {
  IDX.set(CHROME);

  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {                 // candle flicker: dither between two lightings
    const k = y * PW + x;

  }
  for (let j = 0; j < 12; j++) {                                             // the flame
    const w = (1 - j / 12) * 2.6 * (1 + Math.sin(t * 17 + j) * 0.12), sway = Math.sin(t * 5 + j * 0.4) * (j / 12) * 1.5;

      IDX[py * W + px] = m('flame', clamp(v, 0, 1), px, py);
    }
  }
  for (let k = 0; k < 8; k++) {                                              // dust in the window light
    const a = (t * 0.05 + k * 0.137) % 1, x = PX0 + WIN.x0 - 10 + ((k * 23) % 40) + Math.sin(t + k) * 3, y = PY0 + WIN.y1 + 10 + a * 70;
    if (Math.sin(t * 2 + k) > 0) IDX[Math.round(y) * W + Math.round(x)] = OFF.stone + 8;
  }
  const blink = ((t * 0.3) % 1) < 0.03;                                      // eyes in the visor slit
  if (!blink) for (const [ex, ey] of EYES) { IDX[(PY0 + ey) * W + PX0 + ex] = OFF.mint + 1; IDX[(PY0 + ey) * W + PX0 + ex + 1] = OFF.mint + 2; }
  if (G.sel >= 0) { const [x, y, w, h] = LAY.slots[G.sel]; for (let i = 0; i < w; i++) { IDX[y * W + x + i] = OFF.mint + 1; IDX[(y + h - 1) * W + x + i] = OFF.mint + 1; } for (let j = 0; j < h; j++) { IDX[(y + j) * W + x] = OFF.mint + 1; IDX[(y + j) * W + x + w - 1] = OFF.mint + 1; } }
  for (let i = 0, n = W * H; i < n; i++) OUT32[i] = PAL[IDX[i]];
}

// ---------------------------------------------------------------- DOM
let UI = { show() {} };

    at($('portrait'), PX0, PY0, PW, PH);
    document.querySelectorAll('.slot').forEach((el, k) => { const [x, y, w, h] = LAY.slots[k]; at(el, x, y, w, h); });
    at($('cov'), 234, 212, 76, 44);
    document.querySelectorAll('.stat').forEach((el, k) => { const [x, y] = LAY.stats[k]; at(el, x + 30, y + 6, 40, 36); });
    document.querySelectorAll('.skill').forEach((el, k) => { const [cx, cy] = LAY.skills[k]; at(el, cx - 50, cy + 20, 100, 14); });
    at($('lore'), 12, 396, 296, H - 410);
  }
  function resize() {
    const aw = Math.max(1, wrap.clientWidth), ah = Math.max(1, wrap.clientHeight), nh = clamp(Math.round((W * ah) / aw), H_MIN, H_MAX);
    if (nh !== H || !IMG) { setH(nh); canvas.width = W; canvas.height = H; IMG = ctx.createImageData(W, H); OUT32 = new Uint32Array(IMG.data.buffer); }

    layoutDOM();
  }
  window.addEventListener('resize', resize); resize();
  const showSlot = k => { G.sel = k; $('loreName').textContent = SLOTS[k].name; $('loreText').textContent = SLOTS[k].text; };
  document.querySelectorAll('.slot').forEach((el, k) => el.addEventListener('click', () => showSlot(k)));
  $('portrait').addEventListener('click', () => { G.sel = -1; $('loreName').textContent = 'Sir Aldren'; $('loreText').textContent = '\u201CThe Hunter came twenty years ago. It will come again. Until then, the road.\u201D'; });

}
